<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synthetix Host - Zona Free</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#0b0f19] text-white font-sans min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <!-- Header idéntico al dashboard -->
        <header class="flex justify-between items-center mb-8 pb-4 border-b border-white/5">
            <div>
                <a href="/dashboard/" class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                    synthetix<span class="text-indigo-400">.host</span>
                </a>
            </div>
            <div id="user-info" class="text-xs bg-slate-900/80 px-4 py-2 rounded-xl border border-white/10 text-slate-300">
                Cargando sesión...
            </div>
        </header>

        <!-- Título de sección -->
        <div class="mb-6">
            <h1 class="text-2xl font-bold tracking-tight text-white">Zona Free y Recompensas</h1>
            <p class="text-xs text-slate-400 mt-1">Canjea tus s-Coins por descuentos o despliega servidores gratuitos al instante.</p>
        </div>

        <!-- Grid de Balance y Cupones -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            
            <!-- Tarjeta de s-Coins -->
            <div class="bg-[#111827]/80 border border-white/10 p-6 rounded-2xl shadow-xl backdrop-blur-md">
                <div class="flex items-center gap-3 mb-3">
                    <div class="p-2 bg-indigo-500/10 rounded-lg text-indigo-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    </div>
                    <h2 class="text-sm font-medium text-slate-300">Mis s-Coins Disponibles</h2>
                </div>
                <p id="coins-display" class="text-4xl font-extrabold text-cyan-400 tracking-tight">--</p>
                <p class="text-[11px] text-slate-500 mt-2">Gana s-Coins viendo anuncios o completando tareas.</p>
            </div>

            <!-- Tarjeta de Canje de Cupones -->
            <div class="bg-[#111827]/80 border border-white/10 p-6 rounded-2xl shadow-xl backdrop-blur-md flex flex-col justify-between">
                <div>
                    <div class="flex items-center gap-3 mb-3">
                        <div class="p-2 bg-amber-500/10 rounded-lg text-amber-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"></path></svg>
                        </div>
                        <h2 class="text-sm font-medium text-slate-300">Cupón Automático (20%)</h2>
                    </div>
                    <p class="text-xs text-slate-400 mb-4">Costo: <span class="text-amber-400 font-semibold">50 s-Coins</span></p>
                </div>
                <button onclick="reclamarCupon()" class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-medium py-2.5 px-4 rounded-xl text-xs transition-all shadow-lg shadow-indigo-500/20 active:scale-[0.98]">
                    Generar Cupón
                </button>
            </div>
        </div>

        <!-- Tarjeta de Despliegue de Servidor Free -->
        <div class="bg-[#111827]/80 border border-white/10 p-6 rounded-2xl shadow-xl backdrop-blur-md mb-6">
            <div class="flex items-center gap-3 mb-4">
                <div class="p-2 bg-emerald-500/10 rounded-lg text-emerald-400">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M12 5l7 7-7 7"></path></svg>
                </div>
                <h2 class="text-sm font-medium text-white">Desplegar Servidor Minecraft Free</h2>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-5">
                <div>
                    <label class="text-[11px] font-medium text-slate-400 block mb-1.5">Nombre del Servidor</label>
                    <input type="text" id="server-name" value="ServidorFree" class="w-full bg-[#0b0f19] border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500 transition-all">
                </div>
                <div>
                    <label class="text-[11px] font-medium text-slate-400 block mb-1.5">RAM (MB)</label>
                    <input type="number" id="server-ram" value="2048" class="w-full bg-[#0b0f19] border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500 transition-all">
                </div>
                <div>
                    <label class="text-[11px] font-medium text-slate-400 block mb-1.5">CPU (%)</label>
                    <input type="number" id="server-cpu" value="100" class="w-full bg-[#0b0f19] border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500 transition-all">
                </div>
            </div>

            <button onclick="crearServidor()" class="bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-medium py-2.5 px-6 rounded-xl text-xs transition-all shadow-lg shadow-emerald-500/20 active:scale-[0.98]">
                Crear Servidor en Pterodactyl (100 s-Coins)
            </button>
        </div>

        <!-- Consola de Resultados / Alertas -->
        <div id="output-box" class="hidden bg-[#111827] border border-indigo-500/30 p-4 rounded-xl text-xs font-mono text-indigo-300">
            <p id="output-text"></p>
        </div>
    </div>

    <script>
        // Configuración de Supabase
        const SUPABASE_URL = "https://pnnnhkbriqizjmkhodbu.supabase.co";
        const SUPABASE_ANON_KEY = "TU_SUPABASE_ANON_KEY_PUBLICA"; // Asegúrate de colocar tu llave anon aquí
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;

        async function init() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                document.getElementById('user-info').innerHTML = 'No logueado. <a href="/login" class="text-indigo-400 underline font-medium">Entrar</a>';
                return;
            }
            currentUser = session.user;
            document.getElementById('user-info').innerText = currentUser.email;
            cargarCoins();
        }

        async function cargarCoins() {
            const { data } = await supabase.from('profiles').select('s_coins').eq('id', currentUser.id).single();
            if (data) {
                document.getElementById('coins-display').innerText = data.s_coins;
            }
        }

        async function reclamarCupon() {
            if (!currentUser) return alert('Inicia sesión primero.');
            showOutput("Generando cupón automático...");

            const res = await fetch('/reclamar-cupon', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: currentUser.id, costoCoins: 50, descuentoPorcentaje: 20 })
            });
            const data = await res.json();
            if (res.ok) {
                showOutput(`¡Éxito! Cupón creado: ${data.codigo}`);
                cargarCoins();
            } else {
                showOutput(`Error: ${data.error}`);
            }
        }

        async function crearServidor() {
            if (!currentUser) return alert('Inicia sesión primero.');
            const name = document.getElementById('server-name').value;
            const memory = document.getElementById('server-ram').value;
            const cpu = document.getElementById('server-cpu').value;

            showOutput("Conectando con Pterodactyl y desplegando servidor...");

            const res = await fetch('/crear-servidor', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    userId: currentUser.id, 
                    name, 
                    eggId: 1, 
                    memory: parseInt(memory), 
                    cpu: parseInt(cpu), 
                    disk: 10240, 
                    costoCoins: 100 
                })
            });
            const data = await res.json();
            if (res.ok) {
                showOutput(`¡Servidor desplegado con éxito! ID: ${data.server.id}`);
                cargarCoins();
            } else {
                showOutput(`Error al desplegar: ${data.error}`);
            }
        }

        function showOutput(text) {
            const box = document.getElementById('output-box');
            const p = document.getElementById('output-text');
            box.classList.remove('hidden');
            p.innerText = text;
        }

        init();
    </script>
</body>
</html>
