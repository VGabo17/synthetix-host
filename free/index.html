<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synthetix Host - Zona Free</title>
    <!-- Tailwind CSS para un diseño rápido y moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase Client JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-white font-sans min-p-6">

    <div class="max-w-4xl mx-auto p-6">
        <header class="flex justify-between items-center mb-8 border-b border-slate-800 pb-4">
            <h1 class="text-2xl font-bold text-indigo-400">Synthetix Host | <span class="text-white">Panel Free</span></h1>
            <div id="user-info" class="text-sm bg-slate-900 px-4 py-2 rounded-lg border border-slate-800">
                Cargando usuario...
            </div>
        </header>

        <!-- Panel de s-Coins -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl shadow-lg">
                <h2 class="text-lg font-semibold mb-2">Tus s-Coins</h2>
                <p id="coins-display" class="text-3xl font-extrabold text-amber-400 mb-4">0</p>
                <p class="text-xs text-slate-400">Gana s-Coins viendo anuncios o completando tareas en la plataforma.</p>
            </div>

            <!-- Zona de Canje de Cupones -->
            <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl shadow-lg flex flex-col justify-between">
                <div>
                    <h2 class="text-lg font-semibold mb-2">Canjear Cupón Automático</h2>
                    <p class="text-xs text-slate-400 mb-4">Cuesta 50 s-Coins generar un cupón de 20% de descuento.</p>
                </div>
                <button onclick="reclamarCupon()" class="w-full bg-indigo-600 hover:bg-indigo-500 font-medium py-2 px-4 rounded-lg transition-all">
                    Canjear Cupón (50 s-Coins)
                </button>
            </div>
        </div>

        <!-- Zona de Despliegue de Servidor Free -->
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl shadow-lg">
            <h2 class="text-lg font-semibold mb-4 text-emerald-400">Desplegar Servidor Minecraft Free</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                <div>
                    <label class="text-xs text-slate-400 block mb-1">Nombre del Servidor</label>
                    <input type="text" id="server-name" value="MiServidorFree" class="w-full bg-slate-950 border border-slate-800 rounded p-2 text-sm">
                </div>
                <div>
                    <label class="text-xs text-slate-400 block mb-1">RAM (MB)</label>
                    <input type="number" id="server-ram" value="2048" class="w-full bg-slate-950 border border-slate-800 rounded p-2 text-sm">
                </div>
                <div>
                    <label class="text-xs text-slate-400 block mb-1">CPU (%)</label>
                    <input type="number" id="server-cpu" value="100" class="w-full bg-slate-950 border border-slate-800 rounded p-2 text-sm">
                </div>
            </div>
            <button onclick="crearServidor()" class="bg-emerald-600 hover:bg-emerald-500 font-medium py-2 px-6 rounded-lg transition-all text-sm">
                Crear Servidor Automático (100 s-Coins)
            </button>
        </div>

        <!-- Consola de Resultados -->
        <div id="output-box" class="mt-6 bg-slate-900 border border-slate-800 p-4 rounded-xl text-xs font-mono text-slate-300 hidden">
            <p id="output-text"></p>
        </div>
    </div>

    <script>
        // Configura tus credenciales públicas de Supabase para el cliente web
        const SUPABASE_URL = "TU_SUPABASE_URL";
        const SUPABASE_ANON_KEY = "TU_SUPABASE_ANON_KEY";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;

        async function init() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                document.getElementById('user-info').innerHTML = 'No ha iniciado sesión. <a href="/login" class="text-indigo-400 underline">Entrar</a>';
                return;
            }
            currentUser = session.user;
            document.getElementById('user-info').innerText = currentUser.email;
            cargarCoins();
        }

        async function cargarCoins() {
            const { data } = await supabase.from('profiles').select('s_coins').eq('id', currentUser.id).single();
            if (data) {
                document.getElementById('coins-display').innerText = data.s_coins;
            }
        }

        async function reclamarCupon() {
            if (!currentUser) return alert('Inicia sesión primero.');
            showOutput("Generando cupón...");

            const res = await fetch('/reclamar-cupon', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: currentUser.id, costoCoins: 50, descuentoPorcentaje: 20 })
            });
            const data = await res.json();
            if (res.ok) {
                showOutput(`¡Cupón generado con éxito! Código: ${data.codigo}`);
                cargarCoins();
            } else {
                showOutput(`Error: ${data.error}`);
            }
        }

        async function crearServidor() {
            if (!currentUser) return alert('Inicia sesión primero.');
            const name = document.getElementById('server-name').value;
            const memory = document.getElementById('server-ram').value;
            const cpu = document.getElementById('server-cpu').value;

            showOutput("Desplegando servidor en Pterodactyl...");

            const res = await fetch('/crear-servidor', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    userId: currentUser.id, 
                    name, 
                    eggId: 1, // ID de tu egg de Minecraft en Pterodactyl
                    memory: parseInt(memory), 
                    cpu: parseInt(cpu), 
                    disk: 10240, 
                    costoCoins: 100 
                })
            });
            const data = await res.json();
            if (res.ok) {
                showOutput(`¡Servidor creado con éxito! ID en panel: ${data.server.id}`);
                cargarCoins();
            } else {
                showOutput(`Error al crear servidor: ${data.error}`);
            }
        }

        function showOutput(text) {
            const box = document.getElementById('output-box');
            const p = document.getElementById('output-text');
            box.classList.remove('hidden');
            p.innerText = text;
        }

        init();
    </script>
</body>
</html>
