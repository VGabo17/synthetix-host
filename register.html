<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Cuenta | Synthetix Host</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="bg-slate-950 min-h-screen flex items-center justify-center p-6 text-slate-100 font-sans selection:bg-blue-500/30">

  <main class="w-full max-w-md flex flex-col items-center">
    <!-- Logo / Marca -->
    <a href="index.html" class="flex items-center gap-2 mb-8 group">
      <span class="text-blue-500 text-2xl group-hover:scale-110 transition-transform">✦</span>
      <span class="font-bold text-xl tracking-tight text-white">synthetix<span class="text-blue-500">.host</span></span>
    </a>

    <!-- Tarjeta Principal -->
    <div class="w-full bg-slate-900/90 backdrop-blur-xl p-8 rounded-2xl border border-blue-500/30 shadow-2xl shadow-blue-500/10">
      
      <div class="text-center mb-6">
        <span class="inline-block text-[10px] font-bold text-blue-400 uppercase tracking-widest bg-blue-500/10 px-3 py-1 rounded-full border border-blue-500/20 mb-3">
          Comienza Ahora
        </span>
        <h1 class="text-2xl font-bold text-white tracking-tight">Crear una <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400">Cuenta</span></h1>
        <p class="text-xs text-slate-400 mt-1">Únete a la plataforma de Synthetix Host</p>
      </div>

      <!-- Contenedor para Toast y Notificaciones -->
      <div id="toast-root"></div>

      <!-- Formulario (auth.js captura el evento submit automáticamente por la id "register-form") -->
      <form id="register-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1" for="username">Nombre de Usuario</label>
          <input id="username" type="text" required placeholder="tu_usuario" class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 text-sm focus:border-blue-500 focus:outline-none transition-colors placeholder:text-slate-600">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1" for="email">Correo Electrónico</label>
          <input id="email" type="email" required autocomplete="email" placeholder="tu@email.com" class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 text-sm focus:border-blue-500 focus:outline-none transition-colors placeholder:text-slate-600">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1" for="password">Contraseña</label>
          <input id="password" type="password" required minlength="6" autocomplete="new-password" placeholder="••••••••" class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 text-sm focus:border-blue-500 focus:outline-none transition-colors placeholder:text-slate-600">
        </div>

        <button id="submit-btn" type="submit" class="w-full py-3.5 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white font-bold text-xs rounded-xl transition-all shadow-lg shadow-blue-500/20 active:scale-[0.98]">
          Registrarse →
        </button>
      </form>

      <p class="text-center text-xs text-slate-400 mt-6">
        ¿Ya tienes cuenta? <a href="login.html" class="text-purple-400 font-semibold hover:underline">Inicia Sesión</a>
      </p>
    </div>

    <a class="mt-6 text-xs text-slate-500 hover:text-slate-300 font-medium transition-colors flex items-center gap-1" href="index.html">
      &larr; Volver al inicio
    </a>
  </main>

  <!-- Importante: Cargamos auth.js como módulo ES6 -->
  <script type="module" src="assets/js/auth.js"></script>
</body>
</html>
