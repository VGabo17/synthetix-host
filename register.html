<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Cuenta - NixerHost</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="bg-slate-950 min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-md bg-slate-900/90 backdrop-blur-xl p-8 rounded-2xl border border-blue-500/30 shadow-2xl shadow-blue-500/10">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-white">Crear una Cuenta</h1>
      <p class="text-xs text-slate-400 mt-1">Únete a la plataforma de NixerHost</p>
    </div>

    <!-- Caja de Alertas (Mensajes de Error o Éxito) -->
    <div id="alert" class="hidden p-3.5 rounded-xl text-xs font-semibold mb-4 text-center"></div>

    <form id="register-form" onsubmit="event.preventDefault(); handleRegister();" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Nombre de Usuario</label>
        <input id="username" type="text" required class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 text-sm focus:border-blue-500 focus:outline-none transition-colors">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Correo Electrónico</label>
        <input id="email" type="email" required class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 text-sm focus:border-blue-500 focus:outline-none transition-colors">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Contraseña</label>
        <input id="password" type="password" required minlength="6" class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 text-sm focus:border-blue-500 focus:outline-none transition-colors">
      </div>

      <button id="submit-btn" type="submit" class="w-full py-3.5 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white font-bold text-xs rounded-xl transition-all shadow-lg shadow-blue-500/20 disabled:opacity-50 disabled:cursor-not-allowed">
        Registrarse
      </button>
    </form>

    <p class="text-center text-xs text-slate-400 mt-6">
      ¿Ya tienes cuenta? <a href="login.html" class="text-purple-400 font-semibold hover:underline">Inicia Sesión</a>
    </p>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/menu.js"></script>
  <script src="assets/js/auth.js"></script>

  <script>
    async function handleRegister() {
      const user = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('password').value;
      const btn = document.getElementById('submit-btn');

      // Limpiar alertas previas
      showAlert("", "hidden");

      // Bloquear botón durante la carga
      btn.disabled = true;
      btn.textContent = "Procesando...";

      try {
        // Ejecutar la función de registro definida en auth.js
        if (typeof registerUser === 'function') {
          const res = await registerUser(email, pass, user);
          
          if (res && res.error) {
            throw res.error;
          }
        } else {
          throw new Error("La función registerUser no está cargada en auth.js");
        }

        showAlert("¡Cuenta creada correctamente! Redirigiendo...", "success");
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 2000);

      } catch (err) {
        console.error("Error capturado:", err);
        showAlert(err.message || "Ocurrió un error al registrar la cuenta.", "error");
      } finally {
        btn.disabled = false;
        btn.textContent = "Registrarse";
      }
    }

    function showAlert(message, type) {
      const alertBox = document.getElementById('alert');
      if (type === "hidden") {
        alertBox.className = "hidden";
        return;
      }
      
      alertBox.textContent = message;
      if (type === 'error') {
        alertBox.className = "p-3.5 rounded-xl text-xs font-semibold mb-4 text-center bg-red-500/10 border border-red-500/30 text-red-400 block";
      } else if (type === 'success') {
        alertBox.className = "p-3.5 rounded-xl text-xs font-semibold mb-4 text-center bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 block";
      }
    }
  </script>
</body>
</html>
