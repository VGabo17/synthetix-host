<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Contraseña - NixerHost</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="bg-slate-950 min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-md bg-slate-900/90 backdrop-blur-xl p-8 rounded-2xl border border-slate-800 shadow-2xl">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-white">Recuperar Contraseña</h1>
      <p class="text-xs text-slate-400 mt-1">Ingresa tu correo para recibir las instrucciones</p>
    </div>

    <form onsubmit="event.preventDefault(); handleReset();" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Correo Electrónico</label>
        <input id="reset-email" type="email" required class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 text-sm focus:border-purple-500 focus:outline-none">
      </div>

      <button type="submit" class="w-full py-3.5 bg-purple-600 hover:bg-purple-500 text-white font-bold text-xs rounded-xl transition-all">
        Enviar Enlace
      </button>
    </form>

    <div class="text-center mt-6">
      <a href="login.html" class="text-xs text-slate-400 hover:text-white">← Volver al inicio de sesión</a>
    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/menu.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    async function handleReset() {
      const email = document.getElementById('reset-email').value;
      const { error } = await supabaseClient.auth.resetPasswordForEmail(email);
      if (error) showToast(error.message, 'error');
      else showToast('Enlace de recuperación enviado a tu correo.');
    }
  </script>
</body>
</html>
