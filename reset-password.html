<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Contraseña | NixerHost</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="bg-slate-950 min-h-screen flex items-center justify-center p-6 text-slate-100 font-sans">
  <main class="w-full max-w-md">
    <div id="toast-root"></div>

    <div class="bg-slate-900/90 backdrop-blur-xl p-8 rounded-2xl border border-slate-800 shadow-2xl">
      <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-white">Recuperar Contraseña</h1>
        <p class="text-xs text-slate-400 mt-1">Introduce tu correo o tu nueva contraseña</p>
      </div>

      <form id="reset-email-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1" for="reset-email">Correo Electrónico</label>
          <input id="reset-email" type="email" required class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 text-sm focus:border-purple-500 focus:outline-none">
        </div>

        <button type="submit" class="w-full py-3.5 bg-purple-600 hover:bg-purple-500 text-white font-bold text-xs rounded-xl transition-all">
          Enviar enlace
        </button>
      </form>

      <form id="new-password-form" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1" for="new-password">Nueva Contraseña</label>
          <input id="new-password" type="password" minlength="6" required class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 text-sm focus:border-purple-500 focus:outline-none">
        </div>

        <button type="submit" class="w-full py-3.5 bg-purple-600 hover:bg-purple-500 text-white font-bold text-xs rounded-xl transition-all">
          Guardar contraseña
        </button>
      </form>

      <div class="text-center mt-6">
        <a href="login.html" class="text-xs text-slate-400 hover:text-white">← Volver al inicio de sesión</a>
      </div>
    </div>
  </main>

  <script type="module" src="assets/js/reset-password.js"></script>
</body>
</html>
