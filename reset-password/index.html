<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Contraseña | Synthetix Host</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body class="bg-slate-950 min-h-screen flex items-center justify-center p-6 text-slate-100 font-sans selection:bg-blue-500/30">

  <main class="w-full max-w-md flex flex-col items-center">
    <!-- Logo / Ir al inicio -->
    <a href="/" class="flex items-center gap-2 mb-8 group">
      <span class="text-blue-500 text-2xl group-hover:scale-110 transition-transform">✦</span>
      <span class="font-bold text-xl tracking-tight text-white">synthetix<span class="text-blue-500">.host</span></span>
    </a>

    <!-- Tarjeta Principal -->
    <div class="w-full bg-slate-900/90 backdrop-blur-xl p-8 rounded-2xl border border-blue-500/30 shadow-2xl shadow-blue-500/10">
      
      <div id="toast-root"></div>

      <!-- Formulario 1: Solicitar correo de recuperación -->
      <form id="reset-email-form" class="space-y-4">
        <div class="text-center mb-6">
          <span class="inline-block text-[10px] font-bold text-blue-400 uppercase tracking-widest bg-blue-500/10 px-3 py-1 rounded-full border border-blue-500/20 mb-3">
            Seguridad
          </span>
          <h1 class="text-2xl font-bold text-white tracking-tight">Recuperar <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400">Contraseña</span></h1>
          <p class="text-xs text-slate-400 mt-1">Introduce tu correo electrónico para recibir el enlace de recuperación.</p>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1" for="reset-email">Correo Electrónico</label>
          <input id="reset-email" type="email" required autocomplete="email" placeholder="tu@email.com" class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 text-sm focus:border-blue-500 focus:outline-none transition-colors placeholder:text-slate-600">
        </div>

        <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white font-bold text-xs rounded-xl transition-all shadow-lg shadow-blue-500/20 active:scale-[0.98]">
          Enviar enlace →
        </button>

        <div class="text-center pt-2">
          <a href="/login/" class="text-xs text-slate-400 hover:text-white transition-colors">← Volver al inicio de sesión</a>
        </div>
      </form>

      <!-- Formulario 2: Ingresar nueva contraseña (se muestra automáticamente al abrir el correo) -->
      <form id="new-password-form" class="space-y-4" style="display: none;">
        <div class="text-center mb-6">
          <span class="inline-block text-[10px] font-bold text-blue-400 uppercase tracking-widest bg-blue-500/10 px-3 py-1 rounded-full border border-blue-500/20 mb-3">
            Restablecer
          </span>
          <h1 class="text-2xl font-bold text-white tracking-tight">Nueva <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400">Contraseña</span></h1>
          <p class="text-xs text-slate-400 mt-1">Introduce tu nueva contraseña segura.</p>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1" for="new-password">Nueva Contraseña</label>
          <input id="new-password" type="password" required minlength="6" autocomplete="new-password" placeholder="••••••••" class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 text-sm focus:border-blue-500 focus:outline-none transition-colors placeholder:text-slate-600">
        </div>

        <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white font-bold text-xs rounded-xl transition-all shadow-lg shadow-blue-500/20 active:scale-[0.98]">
          Guardar contraseña →
        </button>

        <div class="text-center pt-2">
          <a href="/login/" class="text-xs text-slate-400 hover:text-white transition-colors">← Volver al inicio de sesión</a>
        </div>
      </form>

    </div>
  </main>

  <script type="module" src="/assets/js/reset-password.js"></script>
</body>
</html>
